  <script type="text/javascript">
    // OpenStreetMap x Leaflet
    var element = document.getElementById('osm-map');

    var map = L.map(element);

    L.tileLayer('http://{s}.tile.osm.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="http://osm.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    map.setView(target, 12);

    // L.marker(target).addTo(map);

    //

    for(const [area, pts] of Object.entries(points)) {
      let color;

      switch(area) {
        case 'tr':
          color = "inverse";
          break;
        case 'dos':
          color = "danger";
          break;
        case 'inq':
          color = "info";
          break;
      }

      for(const [loc, crd] of Object.entries(pts)) {
        L.marker(crd, {
          title: loc,
          icon: L.divIcon({
            html: `<button class="btn-solid theme-${color} btn-xs">${area === "tr" ? `<img src="assets/slex.webp" style="height: 25px;" />` : ""}${loc}</button>`,
            // iconUrl: 'https://cdn-icons-png.flaticon.com/512/684/684908.png',
            // iconSize: [32, 32],
            // iconAnchor: [16, 32],
            // popupAnchor: [0, -32]
          })
        }).addTo(map);
      }

      if(area === 'tr')
        L.polyline(Object.values(pts), {color: 'red'}).addTo(map);
    }

    //

    function onMapClick(e) {
      // e.latlng contains both latitude and longitude
      var lat = e.latlng.lat;
      var lng = e.latlng.lng;
      
      console.log("Latitude: " + lat + ", Longitude: " + lng);
      
      // Optional: Add a popup at the clicked location
      // L.popup()
      //   .setLatLng(e.latlng)
      //   .setContent("You clicked at: " + lat.toFixed(5) + ", " + lng.toFixed(5))
      //   .openOn(map);
    }

    map.on('click', onMapClick);

  </script>
